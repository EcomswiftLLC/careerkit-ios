name: Release to App Store Connect

# Manual only. Signs with cloud-managed certificates through the App Store Connect API key
# (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64), archives the Release configuration
# and uploads the build to App Store Connect (TestFlight, then App Review).

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Write API key
        env:
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive (unsigned; the export step signs it)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive             -project CareerKit.xcodeproj             -scheme CareerKit             -configuration Release             -destination "generic/platform=iOS"             -archivePath build/CareerKit.xcarchive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             CURRENT_PROJECT_VERSION=${{ github.run_number }}             | tee build/archive.log | tail -n 40

      - name: Check production ad ids in the archive
        run: |
          APP=build/CareerKit.xcarchive/Products/Applications/CareerKit.app
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$APP/Info.plist" | grep -q "3940256099942544"; then
            echo "Archive uses the Google test app id" && exit 1
          fi

      - name: Export and upload
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>N84NGN3KSH</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/CareerKit.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee build/export.log | tail -n 40

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
