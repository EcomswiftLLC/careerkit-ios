name: Inspect privacy manifests

# Manual diagnostic: builds the Release archive unsigned and prints every PrivacyInfo.xcprivacy inside it,
# with the tracking flag and the tracking domains, so App Store Connect's ITMS-91064 can be traced to a file.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project CareerKit.xcodeproj -scheme CareerKit -configuration Release -destination "generic/platform=iOS" -archivePath build/CareerKit.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 5
      - name: Print manifests
        run: |
          APP=build/CareerKit.xcarchive/Products/Applications/CareerKit.app
          f="$APP/Frameworks/UserMessagingPlatform.framework/PrivacyInfo.xcprivacy"
          echo "##### UMP raw PlistBuddy:"; /usr/libexec/PlistBuddy -c "Print" "$f" || true
          echo "##### UMP tracking keys:"; plutil -convert xml1 -o - "$f" | grep -n -A6 -E "Tracking" || true
          echo "##### GMA tracking keys:"; plutil -convert xml1 -o - "$APP/Frameworks/GoogleMobileAds.framework/PrivacyInfo.xcprivacy" | grep -n -A6 -E "TrackingDomains|<key>NSPrivacyTracking<" || true
          echo "##### root file head:"; head -c 300 "$APP/PrivacyInfo.xcprivacy" | cat -v | head -8
