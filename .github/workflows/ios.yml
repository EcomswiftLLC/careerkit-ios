name: iOS build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_26*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project CareerKit.xcodeproj -scheme CareerKit

      - name: Unit tests
        env:
          TEST_RUNNER_CAREERKIT_DUMP_DIR: /tmp/careerkit-renders
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          echo "Simulator: $DEST"
          xcodebuild test \
            -project CareerKit.xcodeproj \
            -scheme CareerKit \
            -destination "id=$DEST" \
            -only-testing:CareerKitTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | tail -n 200
        shell: bash

      - name: UI screenshots
        if: always()
        continue-on-error: true
        env:
          TEST_RUNNER_CAREERKIT_SHOT_DIR: /tmp/careerkit-shots
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/' || true)
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/'); fi
          echo "Simulator: $DEST"
          xcodebuild test \
            -project CareerKit.xcodeproj \
            -scheme CareerKit \
            -destination "id=$DEST" \
            -only-testing:CareerKitUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/uitests.log | tail -n 120
        shell: bash

      - name: UI screenshots (iPad, dark mode)
        if: always()
        continue-on-error: true
        env:
          TEST_RUNNER_CAREERKIT_SHOT_DIR: /tmp/careerkit-shots-ipad-dark
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -E "iPad Pro 13-inch|iPad Pro \(13-inch\)|iPad Air 13-inch" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/' || true)
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPad" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/' || true); fi
          echo "Simulator: $DEST"
          xcrun simctl boot "$DEST" || true
          xcrun simctl ui "$DEST" appearance dark || true
          xcodebuild test \
            -project CareerKit.xcodeproj \
            -scheme CareerKit \
            -destination "id=$DEST" \
            -only-testing:CareerKitUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/uitests-ipad-dark.log | tail -n 60
        shell: bash

      - name: UI screenshots (Spanish, French, German, Chinese)
        if: always()
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/' || true)
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/'); fi
          echo "Simulator: $DEST"
          xcrun simctl boot "$DEST" || true
          xcrun simctl ui "$DEST" appearance light || true
          mkdir -p /tmp/careerkit-shots-l10n
          for LANGCODE in de zh-Hans fr es; do
            echo "=== $LANGCODE ==="
            TEST_RUNNER_CAREERKIT_LANG=$LANGCODE TEST_RUNNER_CAREERKIT_SHOT_DIR=/tmp/careerkit-shots-l10n \
            xcodebuild test \
              -project CareerKit.xcodeproj \
              -scheme CareerKit \
              -destination "id=$DEST" \
              -only-testing:CareerKitUITests/LocalizedScreenshotTests \
              CODE_SIGNING_ALLOWED=NO \
              | tee build/uitests-l10n-$LANGCODE.log | tail -n 15 || true
          done
        shell: bash

      - name: Release build check
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project CareerKit.xcodeproj \
            -scheme CareerKit \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/dd-release \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/release.log | tail -n 20
          APP=$(find build/dd-release -name CareerKit.app -maxdepth 6 | head -1)
          echo "App: $APP"
          for K in GADApplicationIdentifier CKBannerAdUnitID CKRewardedAdUnitID; do /usr/libexec/PlistBuddy -c "Print :$K" "$APP/Info.plist" 2>/dev/null || true; done
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$APP/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$APP/Info.plist" | grep -q "3940256099942544"; then
            echo "Release build still uses the Google test app id" && exit 1
          fi
        shell: bash

      - name: Rasterize rendered PDFs
        if: always()
        run: |
          if [ -d /tmp/careerkit-renders ]; then
            brew install poppler >/dev/null 2>&1 || true
            cd /tmp/careerkit-renders
            for f in *.pdf; do pdftoppm -r 80 -png "$f" "${f%.pdf}" || true; done
            ls | wc -l
          fi

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: /tmp/careerkit-renders
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/careerkit-shots
          if-no-files-found: ignore

      - name: Upload iPad dark screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ipad-dark
          path: /tmp/careerkit-shots-ipad-dark
          if-no-files-found: ignore

      - name: Upload localized screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-l10n
          path: /tmp/careerkit-shots-l10n
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
